name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  environment-setup-and-test:
    name: Setup Environments & Validate Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud API dependencies
        run: |
          cd apps/api
          npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge & Simulator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/edge/requirements.txt
          pip install -r services/simulator/requirements.txt

  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edge-service container
        run: |
          docker build -t edgesentinel-edge:ci ./services/edge

      - name: Build cloud-api container
        run: |
          docker build -t edgesentinel-cloud-api:ci ./apps/api

      - name: Build simulator container
        run: |
          docker build -t edgesentinel-simulator:ci ./services/simulator

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
