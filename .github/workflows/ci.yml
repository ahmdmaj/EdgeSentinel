name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api-checks:
    name: API Checks (Node 22)
    runs-on: ubuntu-latest
    needs: [secret-scanning]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Run TypeScript Typecheck
        working-directory: ./apps/api
        run: npx tsc --noEmit

      - name: Run API Tests
        working-directory: ./apps/api
        run: npm run test

  edge-checks:
    name: Edge Checks (Python 3.11)
    runs-on: ubuntu-latest
    needs: [secret-scanning]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Edge dependencies
        working-directory: ./services/edge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Edge Tests (Pytest)
        working-directory: ./services/edge
        env:
          PYTHONPATH: ${{ github.workspace }}/services/edge
        run: pytest

  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: [api-checks, edge-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build edge-service container
        run: docker build -t edgesentinel-edge:ci ./services/edge

      - name: Run Trivy vulnerability scanner on Edge image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'edgesentinel-edge:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build cloud-api container
        run: docker build -t edgesentinel-cloud-api:ci ./apps/api

      - name: Run Trivy vulnerability scanner on API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'edgesentinel-cloud-api:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build simulator container
        run: docker build -t edgesentinel-simulator:ci ./services/simulator

      - name: Validate Docker Compose Configuration
        run: docker compose config

