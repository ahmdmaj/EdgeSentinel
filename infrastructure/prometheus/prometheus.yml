global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'edge-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['edge-service:8000']

  - job_name: 'cloud-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cloud-api:3000']
