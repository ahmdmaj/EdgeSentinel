version: '3.8'

services:
  # ==========================================
  # EdgeSentinel Internal Services (Not Exposed)
  # ==========================================
  mysql:
    ports: [] # Remove host port binding

  mosquitto:
    ports: [] # Remove host port binding

  prometheus:
    ports: [] # Remove host port binding

  grafana:
    ports: [] # Remove host port binding

  simulator:
    # Simulator should not be exposed in any way

  edge-service:
    ports: [] # Remove host port binding

  cloud-api:
    ports: [] # Remove host port binding

  web:
    ports: [] # Remove host port binding

  # ==========================================
  # Nginx Reverse Proxy (SSL Termination)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: edgesentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - edgesentinel-network
    depends_on:
      - cloud-api
      - web
    restart: unless-stopped
